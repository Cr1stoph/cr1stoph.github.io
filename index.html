    <script>
      // Aplica el tema antes del primer render para evitar un destello de
      // colores incorrectos. Si no hay preferencia guardada, usa la del sistema.
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var isDark = stored === 'dark' || (stored !== 'light' && prefersDark)

          document.documentElement.classList.toggle('dark', isDark)
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'

          var themeColor = document.getElementById('theme-color')
          if (themeColor) {
            themeColor.setAttribute('content', isDark ? '#020617' : '#f8fafc')
          }
        } catch (error) {
          // Si localStorage no está disponible, se usa el tema del sistema.
        }
      })()
    </script>
